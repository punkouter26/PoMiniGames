<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoMiniGames</title>
    <base href="/" />

    <!-- Bug fix QA #10: start the WASM download as early as possible so the
         browser can warm up the connection and overlap the TCP/TLS handshake
         with the HTML parse. The actual script tag below drives execution;
         the modulepreload just primes the network. ~1.2 s cold-start win.
         Note: only blazor.webassembly.js is the real, non-hashed boot script.
         The dotnet.* runtime + native modules are emitted with content hashes
         and discovered at runtime by the Blazor loader — preloading them by
         their unhashed names 404s and pollutes DevTools with red noise. -->
    <link rel="modulepreload" href="_framework/blazor.webassembly.js" />

    <!-- Typography (non-render-blocking): fonts load async so first paint is not
         gated on three third-party stylesheets. system-ui renders immediately and
         swaps to the webfont when ready (the type tokens fall back to system-ui). -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Inter (display) -->
    <link rel="preload" href="https://rsms.me/inter/inter.css" as="style"
          onload="this.onload=null;this.rel='stylesheet'" />
    <!-- PoClick: Orbitron (headings) + Outfit (body) -->
    <link rel="preload"
          href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap"
          as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" />
    </noscript>

    <!-- Remove Bootstrap – all styles are custom (payload savings ~187KB) -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/poclick.css" />
    <link rel="stylesheet" href="css/fight.css" />
    <!-- PoJoker (demo game): hand-written medieval-dark theme (scoped to .pojoker-root) -->
    <link rel="stylesheet" href="css/pojoker-theme.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="PoMiniGames — instant-play mini-games with AI opponents, real-time 2P multiplayer, and global leaderboards. Offline-resilient." />
    <meta property="og:title" content="PoMiniGames" />
    <meta property="og:description" content="Instant-play mini-games · AI opponents · real-time 2P multiplayer · leaderboards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="PoMiniGamesClient.styles.css" rel="stylesheet" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
    </script>

    <!-- View Transitions + App enhancements (Suggestion #5) -->
    <script src="scripts/app.js" defer></script>
    <!-- Native Web Audio micro-feedback on tap targets (Suggestion #9) -->
    <script src="js/uiFeedback.js" defer></script>
    <!-- PoFace webcam capture (consolidation import) -->
    <script src="js/webcam.js" defer></script>
    <!-- AppErrorBoundary fallback clipboard helper (non-secure-context safe) -->
    <script src="js/appErrorBoundary.js" defer></script>
    <!-- Microsoft sign-in (MSAL.js + interop wrapper). Loaded eagerly so the
         login gate can call poAuth.* during startup when OAuth is configured.
         NOTE: consider pinning a Subresource Integrity hash for this CDN script
         before production. -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.4/lib/msal-browser.min.js" integrity="sha384-FyFWjaUFP9q0tLEvcwV9UloGlRNkfP3l+vmNCjwLpji7ChADDrvdXXXNIufO0sEw" crossorigin="anonymous"></script>
    <script src="js/poauth.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" viewBox="0 0 100 100">
            <circle r="40" cx="50" cy="50" />
            <circle r="40" cx="50" cy="50" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- PoJoker: TTS/Web-Audio effect generators -->
    <script src="js/pojoker-speech-interop.js"></script>
    <script src="js/pojoker-audio-interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script type="module" src="js/voxelshooter.js"></script>
    <script type="module" src="js/marblerace/index.js"></script>
    <script type="module" src="js/pobrawl/index.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/racingInterop.js"></script>
    <!-- PoSurvive: inert global helpers (define window.* objects, no side effects until invoked) -->
    <script src="js/posurvive/theme.js"></script>
    <script src="js/posurvive/uiHelpers.js"></script>
    <script src="js/posurvive/gpuProbe.js"></script>
    <script src="js/posurvive/indexedDbStore.js"></script>
    <script src="js/posurvive/inferenceWorkerBridge.js"></script>
    <script src="js/posurvive/audioEngine.js" defer></script>
</body>

</html>
