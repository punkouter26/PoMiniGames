<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoMiniGames</title>
    <base href="/" />
    <!-- Blazor runtime loads automatically, preload not needed -->

    <!-- Typography: Inter variable font (Suggestion #4) -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="preload" href="https://rsms.me/inter/inter.css" as="style" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- PoClick fonts: Orbitron (headings) and Outfit (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Remove Bootstrap – all styles are custom (payload savings ~187KB) -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/poclick.css" />
    <link rel="stylesheet" href="css/fight.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoMiniGamesClient.styles.css" rel="stylesheet" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
    </script>

    <!-- View Transitions + App enhancements (Suggestion #5) -->
    <script src="scripts/app.js" defer></script>
    <!-- PoFace webcam capture (consolidation import) -->
    <script src="js/webcam.js" defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" viewBox="0 0 100 100">
            <circle r="40" cx="50" cy="50" />
            <circle r="40" cx="50" cy="50" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script type="module" src="js/voxelshooter.js"></script>
    <script type="module" src="js/marblerace/index.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/racingInterop.js"></script>
</body>

</html>
